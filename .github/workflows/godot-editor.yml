name: Crownfront Godot Editor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/godot-editor.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - name: Download Godot 4.7.1 Linux editor
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 \
            --output Godot_v4.7.1-stable_linux.x86_64.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          printf '%s  %s\n' \
            c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba \
            Godot_v4.7.1-stable_linux.x86_64.zip | sha256sum -c -
      - name: Upload verified editor
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.1-linux-editor
          path: Godot_v4.7.1-stable_linux.x86_64.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
