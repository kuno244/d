name: Crownfront Toolchain Bootstrap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Create connector transfer probe
        run: |
          mkdir -p artifact
          printf 'CROWNFRONT_TOOLCHAIN_PROBE_OK\n' > artifact/probe.txt
      - name: Upload transfer probe
        uses: actions/upload-artifact@v4
        with:
          name: crownfront-toolchain-probe
          path: artifact/probe.txt
          if-no-files-found: error
          retention-days: 1
